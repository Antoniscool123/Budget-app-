name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            reason=$(grep -E "FAIL|AssertionError|Error:|×" test.log | head -6 | tr '\n' ' ' | cut -c1-1200)
            echo "::error title=Tests fejlede::${reason}"
            exit $status
          fi
      - run: npm run build
